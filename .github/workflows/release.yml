name: release

# Publish a GitHub Release when a vX.Y.Z tag is pushed. Release notes are
# the matching CHANGELOG.md section, so the changelog stays the single
# source of truth and the tag, build.zig.zon, and changelog cannot drift
# apart in a published release. A tag publishes only when it points at a
# commit on a branch that releases whose push run's ci-ok passed.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {fetch-depth: 0, persist-credentials: false}

      - name: verify the tagged commit landed and passed ci-ok
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          b=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:lstrip=3)' | grep -Ex 'main|zig-[0-9]+\.[0-9]+|v[0-9]+(\.[0-9]+)?\.x' || true)
          [ -n "$b" ] || { echo "tag is on no branch that releases"; exit 1; }
          id=$(gh run list -R "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --event push --workflow ci.yml --json databaseId --jq '.[0].databaseId')
          c=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "ci-ok") | .conclusion')
          [ "$c" = success ] || { echo "ci-ok of the push run: $c"; exit 1; }

      - name: verify version and extract notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "tag $tag is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          zon_version="$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",/\1/p' build.zig.zon)"
          if [ "$version" != "$zon_version" ]; then
            echo "tag $tag does not match build.zig.zon version $zon_version" >&2
            exit 1
          fi
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md section for $version" >&2
            exit 1
          fi
          echo "release notes for $version:"
          cat release-notes.md

      - name: create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          # 0.4.x releases from v0.4.x are never the highest version.
          make_latest: false
